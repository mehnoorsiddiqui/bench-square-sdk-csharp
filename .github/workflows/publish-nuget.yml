name: Publish to NuGet

# Run by hand (or by api-upgrade-bench) once per SDK version: gh workflow run publish-nuget.yml -f version=1.0.0
# No push trigger: every version is published on purpose, never auto-numbered.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.0.0); matches the SDK's tag v<version>"
        required: true
        type: string

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  PROJECT: src/Square/Square.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the release tag
      id-token: write   # NuGet trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$PROJECT"

      - name: Build
        run: >
          dotnet build "$PROJECT" -c Release --no-restore
          -p:Version=${{ inputs.version }}
          -p:CustomAfterMicrosoftCommonTargets=${{ github.workspace }}/.github/nuget/Package.targets

      - name: Pack
        run: >
          dotnet pack "$PROJECT" -c Release --no-build -o artifacts
          -p:Version=${{ inputs.version }}
          -p:CustomAfterMicrosoftCommonTargets=${{ github.workspace }}/.github/nuget/Package.targets

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Tag release (if not tagged yet)
        shell: bash
        run: |
          TAG="v${{ inputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" && git push origin "$TAG"
          fi
